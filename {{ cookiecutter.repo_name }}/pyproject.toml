[project]
name = "{{ cookiecutter.repo_name }}"
version = "0.1.0"
description = "{{ cookiecutter.description }}"
requires-python = ">=3.12.1"
dependencies = [
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "matplotlib>=3.10.7",
    "xgboost>=3.1.1",
    "seaborn>=0.13.2",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pyarrow>=22.0.0",
]

[tool.uv.sources]
src = { path = "src", editable = true }

[dependency-groups]
dev = [
    "jupyterlab",
    "pytest",
    "black",
    "isort",
    "mypy",
    "rich",
]


[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true
known_first_party = ["src"]
known_third_party = ["fastapi", "pandas", "sklearn", "xgboost", "boto3"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle (errores)
    "F",    # Pyflakes
    "B",    # Bugbear (malas prácticas)
    "I",    # isort rules
    "UP",   # Modernización de código (pyupgrade)
    "C4",   # Comprehensions limpias
]
ignore = [
    "E501", # line too long (ya lo maneja Black)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # ignora imports no usados en __init__.py


[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
ignore_missing_imports = true
strict_optional = true
show_error_codes = true
pretty = true
plugins = []

[tool.bandit]
targets = ["src"]
skips = ["B101"]  # salta uso de assert (útil en tests)